<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Zach’s Case Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column app shell, mode switch on top, three views (Train / Cases / Plan), bottom tab bar. */
:root {
  --bg: #eef0f3; --surface: #ffffff; --surface-2: #f5f6f8; --line: #d9dde3; --fg: #15181d; --muted: #5d6573;
  --accent: #2456d8; --accent-ink: #ffffff; --accent-soft: #e3eafc;
  --good: #1f8a4c; --good-soft: #dff3e6; --warn: #b26a00; --warn-soft: #fbefd9; --bad: #c42b3a; --bad-soft: #fbe3e5;
  --gray-sticker: #a6acb6; --sticker-line: #1d2026; --cube-body: #1d2026;
  --sU: #f6d20e; --sF: #1aa35a; --sR: #ff8a1f; --sB: #2563eb; --sL: #d7263d; --sD: #fbfbfb;
  --f-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1216; --surface: #181c22; --surface-2: #1f242c; --line: #2c333d; --fg: #e8ebf0; --muted: #9aa3b2;
  --accent: #7ea2ff; --accent-ink: #0d1530; --accent-soft: #1d2747;
  --good: #4fcf86; --good-soft: #15301f; --warn: #f0b04a; --warn-soft: #33270f; --bad: #ff7a86; --bad-soft: #3a1a1e;
  --gray-sticker: #4a515c; --sticker-line: #0b0d10; --cube-body: #0b0d10; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1216; --surface: #181c22; --surface-2: #1f242c; --line: #2c333d; --fg: #e8ebf0; --muted: #9aa3b2;
  --accent: #7ea2ff; --accent-ink: #0d1530; --accent-soft: #1d2747;
  --good: #4fcf86; --good-soft: #15301f; --warn: #f0b04a; --warn-soft: #33270f; --bad: #ff7a86; --bad-soft: #3a1a1e;
  --gray-sticker: #4a515c; --sticker-line: #0b0d10; --cube-body: #0b0d10; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.shell { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 96px; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 20px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; margin-right: auto; }
.brand svg { width: 22px; height: 22px; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font-weight: 600; font-family: var(--f-display); cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: center; gap: 4px; padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
nav.tabs button { flex: 1; max-width: 200px; border: 0; background: transparent; padding: 8px 6px; border-radius: 10px; font-weight: 600; color: var(--muted); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 13px; }
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); }
h2 { font-family: var(--f-display); font-size: 18px; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h3 { font-family: var(--f-display); font-size: 15px; margin: 0; }
.label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 9px; cursor: pointer; font-weight: 500; font-size: 14px; }
.btn:hover { border-color: var(--muted); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.small { padding: 4px 9px; font-size: 13px; }
.btn.danger { color: var(--bad); }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.alg { font-family: var(--f-mono); font-size: 13px; overflow-wrap: anywhere; }
.pill { display: inline-flex; align-items: center; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; letter-spacing: 0.02em; white-space: nowrap; }
.st-new { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.st-learning { background: var(--warn-soft); color: var(--warn); }
.st-practicing { background: var(--accent-soft); color: var(--accent); }
.st-known { background: var(--good-soft); color: var(--good); }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }

/* Train */
.train { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 820px) { .train { grid-template-columns: 1.15fr 1fr; align-items: start; } }
.scramble { font-family: var(--f-mono); font-size: clamp(17px, 4.6vw, 22px); line-height: 1.5; word-spacing: 0.15em; font-weight: 500; overflow-wrap: anywhere; }
.timerpad { user-select: none; -webkit-user-select: none; touch-action: none; cursor: pointer; text-align: center; padding: 26px 12px 20px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); }
.timerpad .time { font-family: var(--f-display); font-weight: 700; font-size: clamp(56px, 17vw, 96px); line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.timerpad.holding .time { color: var(--bad); }
.timerpad.ready .time { color: var(--good); }
.timerpad.running { background: var(--surface-2); }
.timerpad .hint { margin-top: 8px; color: var(--muted); font-size: 13px; }
.caseinfo { display: flex; gap: 12px; align-items: center; min-width: 0; }
.caseinfo svg.dia { width: 92px; height: 92px; flex: none; }
.caseinfo > div { min-width: 0; }
.veil { display: flex; align-items: center; justify-content: center; height: 92px; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); font-size: 13px; text-align: center; padding: 8px; }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; font-weight: 500; }
.switch input { appearance: none; width: 38px; height: 22px; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; margin: 0; transition: background .15s; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); transition: transform .15s; }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { transform: translateX(16px); }
.net { width: 100%; max-width: 330px; display: block; margin: 0 auto; }
.result { display: grid; gap: 10px; }
.statgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 9px; padding: 8px; }
.stat b { display: block; font-family: var(--f-display); font-size: 18px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--muted); }
.banner { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--accent-soft); color: var(--fg); border-radius: var(--r); padding: 10px 14px; }
.banner .t { font-family: var(--f-display); font-weight: 700; font-variant-numeric: tabular-nums; color: var(--accent); }
.history { display: flex; flex-wrap: wrap; gap: 6px; }
.history span { font-variant-numeric: tabular-nums; font-size: 13px; background: var(--surface-2); padding: 2px 7px; border-radius: 6px; }
.history span.f { color: var(--bad); text-decoration: line-through; }

/* Cases */
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
@media (max-width: 420px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.case { position: relative; background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r); padding: 10px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; min-width: 0; text-align: left; }
.case.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.case:not(.on) svg.dia { opacity: .55; }
.case svg.dia { width: 100%; max-width: 120px; aspect-ratio: 1; margin: 0 auto; display: block; }
.case .nm { font-family: var(--f-display); font-weight: 600; font-size: 14px; display: flex; justify-content: space-between; gap: 6px; align-items: baseline; }
.case .alg { font-size: 11.5px; color: var(--muted); line-height: 1.35; }
.case .meta { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.case .check { position: absolute; top: 8px; left: 8px; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.case.on .check { background: var(--accent); border-color: var(--accent); }
.case.on .check::after { content: ""; width: 9px; height: 5px; border-left: 2px solid var(--accent-ink); border-bottom: 2px solid var(--accent-ink); transform: rotate(-45deg) translate(1px, -1px); }
.case .edit { border: 1px solid var(--line); background: var(--surface-2); border-radius: 7px; padding: 2px 8px; font-size: 12px; cursor: pointer; }
.groupttl { font-family: var(--f-display); font-weight: 600; margin: 8px 0 -2px; color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; }

/* Plan */
.bars { display: grid; gap: 10px; }
.bar { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; display: flex; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; }
.bar .k { background: var(--good); } .bar .p { background: var(--accent); } .bar .l { background: var(--warn); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: 0; }
.blocks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 560px) { .blocks { grid-template-columns: 1fr; } }
.block { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 6px; background: var(--surface-2); }
.block .mins { font-family: var(--f-display); font-weight: 700; font-size: 22px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font-size: 13px; background: var(--surface); cursor: pointer; }
.chip small { color: var(--muted); font-variant-numeric: tabular-nums; }
ol.steps { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
textarea, input[type="text"] { width: 100%; font-family: var(--f-mono); font-size: 14px; background: var(--surface-2); color: var(--fg); border: 1px solid var(--line); border-radius: 9px; padding: 9px; }

/* Sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(8, 10, 14, .45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
@media (min-width: 640px) { .sheet-bg { align-items: center; } }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 92vh; overflow: auto; border-radius: 16px 16px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 12px; }
@media (min-width: 640px) { .sheet { border-radius: 16px; } }
.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 30; font-weight: 500; font-size: 14px; max-width: calc(100% - 32px); }
.note { font-size: 13px; padding: 8px 10px; border-radius: 8px; }
.note.ok { background: var(--good-soft); color: var(--good); } .note.err { background: var(--bad-soft); color: var(--bad); }
svg .sU { fill: var(--sU); } svg .sF { fill: var(--sF); } svg .sR { fill: var(--sR); } svg .sB { fill: var(--sB); } svg .sL { fill: var(--sL); } svg .sD { fill: var(--sD); } svg .sX { fill: var(--gray-sticker); }
svg .body { fill: var(--cube-body); } svg .edge { stroke: var(--cube-body); stroke-width: .06; }
svg .arw { stroke: #15181d; stroke-width: .12; stroke-linecap: round; fill: none; } svg .arwh { fill: #15181d; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="shell">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="6" height="6" rx="1.2" fill="var(--sU)"/><rect x="9" y="2" width="6" height="6" rx="1.2" fill="var(--sU)"/><rect x="16" y="2" width="6" height="6" rx="1.2" fill="var(--gray-sticker)"/><rect x="2" y="9" width="6" height="6" rx="1.2" fill="var(--gray-sticker)"/><rect x="9" y="9" width="6" height="6" rx="1.2" fill="var(--sU)"/><rect x="16" y="9" width="6" height="6" rx="1.2" fill="var(--sU)"/><rect x="2" y="16" width="6" height="6" rx="1.2" fill="var(--sU)"/><rect x="9" y="16" width="6" height="6" rx="1.2" fill="var(--gray-sticker)"/><rect x="16" y="16" width="6" height="6" rx="1.2" fill="var(--sU)"/></svg>Zach’s Case Trainer</div>
    <div class="seg" role="group" aria-label="Algorithm set" id="modeSeg">
      <button data-mode="pll">PLL</button><button data-mode="oll">OLL</button><button data-mode="f2l">F2L</button>
    </div>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs" id="tabs">
  <button data-tab="train"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>Train</button>
  <button data-tab="cases"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Cases</button>
  <button data-tab="pll15"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M7 14l2.5 2.5L15 12"/></svg>Full PLL</button>
</nav>

<script>
/* Cube simulator core: facelet model built from 3D sticker coordinates. */
const Cube = (() => {
  const FACES = 'URFDLB';
  // face -> (row,col) -> [pos, normal]
  function faceSticker(f, r, c) {
    const a = -1 + c, b = 1 - r;
    switch (f) {
      case 'U': return [[-1 + c, 1, -1 + r], [0, 1, 0]];
      case 'D': return [[-1 + c, -1, 1 - r], [0, -1, 0]];
      case 'F': return [[a, b, 1], [0, 0, 1]];
      case 'B': return [[1 - c, b, -1], [0, 0, -1]];
      case 'R': return [[1, b, 1 - c], [1, 0, 0]];
      case 'L': return [[-1, b, -1 + c], [-1, 0, 0]];
    }
  }
  const ST = [];
  for (const f of FACES) for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
    const [p, n] = faceSticker(f, r, c); ST.push({ f, r, c, p, n });
  }
  const key = (p, n) => p.join(',') + '|' + n.join(',');
  const IDX = new Map(ST.map((s, i) => [key(s.p, s.n), i]));
  const idx = (f, r, c) => FACES.indexOf(f) * 9 + r * 3 + c;

  // rotate vector clockwise (seen from +axis) by one quarter
  function rotCW(v, ax) {
    const [x, y, z] = v;
    if (ax === 'x') return [x, z, -y];
    if (ax === 'y') return [-z, y, x];
    return [y, -x, z];
  }
  function rotCCW(v, ax) { return rotCW(rotCW(rotCW(v, ax), ax), ax); }
  // move defs: [axis, sign(+1 cw about +axis), layer predicate on coord]
  const AX = { x: 0, y: 1, z: 2 };
  const DEF = {
    U: ['y', 1, v => v === 1], D: ['y', -1, v => v === -1], R: ['x', 1, v => v === 1], L: ['x', -1, v => v === -1],
    F: ['z', 1, v => v === 1], B: ['z', -1, v => v === -1],
    u: ['y', 1, v => v >= 0], d: ['y', -1, v => v <= 0], r: ['x', 1, v => v >= 0], l: ['x', -1, v => v <= 0],
    f: ['z', 1, v => v >= 0], b: ['z', -1, v => v <= 0],
    M: ['x', -1, v => v === 0], E: ['y', -1, v => v === 0], S: ['z', 1, v => v === 0],
    x: ['x', 1, () => true], y: ['y', 1, () => true], z: ['z', 1, () => true],
  };
  const PERM = {};
  for (const m in DEF) {
    const [ax, sg, pred] = DEF[m];
    const perm = new Array(54); // perm[i] = destination of sticker i
    ST.forEach((s, i) => {
      if (!pred(s.p[AX[ax]])) { perm[i] = i; return; }
      const fn = sg > 0 ? rotCW : rotCCW;
      perm[i] = IDX.get(key(fn(s.p, ax), fn(s.n, ax)));
    });
    PERM[m] = perm;
  }
  function solved() { const a = []; for (const f of FACES) for (let i = 0; i < 9; i++) a.push(f); return a; }
  function applyMove(st, m, times) {
    const p = PERM[m];
    for (let t = 0; t < times; t++) { const n = new Array(54); for (let i = 0; i < 54; i++) n[p[i]] = st[i]; st = n; }
    return st;
  }
  // parse: returns [{m, n}] n in 1..3 (quarter turns cw)
  function parse(alg) {
    const out = [];
    const s = alg.replace(/[()\[\]]/g, ' ').replace(/’/g, "'");
    const re = /([URFDLBurfdlbMESxyz])(w?)(\d*)('?)/g;
    let mm;
    const cleaned = s.replace(/\s+/g, ' ').trim();
    // validate tokens
    for (const tok of cleaned.split(' ')) { if (tok && !/^([URFDLBurfdlbMESxyz])w?\d*'?$/.test(tok)) throw new Error('Unknown move "' + tok + '"'); }
    while ((mm = re.exec(cleaned))) {
      let m = mm[1]; if (mm[2]) m = m.toLowerCase();
      let n = mm[3] ? parseInt(mm[3], 10) : 1; if (mm[4]) n = -n;
      n = ((n % 4) + 4) % 4; if (n) out.push({ m, n });
    }
    return out;
  }
  function apply(st, alg) {
    const mv = typeof alg === 'string' ? parse(alg) : alg;
    for (const { m, n } of mv) st = applyMove(st, m, n);
    return st;
  }
  const fmt = mv => mv.map(({ m, n }) => m + (n === 2 ? '2' : n === 3 ? "'" : '')).join(' ');
  const invert = mv => mv.slice().reverse().map(({ m, n }) => ({ m, n: (4 - n) % 4 }));
  const invertStr = a => fmt(invert(parse(a)));

  // center-relative: recolor each sticker by which face's center has that color, so whole-cube rotation is normalized
  const ROTS = (() => { // 24 rotation sequences
    const seqs = []; const seen = new Set();
    const pre = ['', 'x', 'x2', "x'", 'z', "z'"];
    for (const a of pre) for (const b of ['', 'y', 'y2', "y'"]) {
      const s = (a + ' ' + b).trim(); const k = apply(solved(), s).join('');
      if (!seen.has(k)) { seen.add(k); seqs.push(s); }
    }
    return seqs;
  })();
  function reorient(st) { // rotate whole cube so centers are home (U on U, F on F)

/* ---------- diagrams ---------- */
const CLS = { U: 'sU', F: 'sF', R: 'sR', B: 'sB', L: 'sL', D: 'sD' };
const ST = C.ST;
const cache = {};
function llSVG(c) {
  const st = E.caseState(c.mode, c);
  const isPLL = c.mode === 'pll';
  let s = `<svg class="dia" viewBox="-2.2 -2.2 4.4 4.4" role="img" aria-label="${esc(c.name)}"><rect x="-1.56" y="-1.56" width="3.12" height="3.12" rx=".22" class="body"/>`;
  ST.forEach((t, i) => {
    if (t.p[1] !== 1) return;
    const col = isPLL ? CLS[st[i]] : (st[i] === 'U' ? 'sU' : 'sX');
    const [x, , z] = t.p, n = t.n;
    let r;

    else if (n[2] === 1) r = [x - .44, 1.66, .88, .4];
    else if (n[2] === -1) r = [x - .44, -2.06, .88, .4];
    else if (n[0] === 1) r = [1.66, z - .44, .4, .88];
    else r = [-2.06, z - .44, .4, .88];

  });

}

    const x1 = a[0] + dx / L * sh, y1 = a[2] + dz / L * sh, x2 = b[0] - dx / L * sh, y2 = b[2] - dz / L * sh;
    out += `<line x1="${x1.toFixed(3)}" y1="${y1.toFixed(3)}" x2="${x2.toFixed(3)}" y2="${y2.toFixed(3)}" class="arw" marker-end="url(#ah)"${dbl ? ' marker-start="url(#ah)"' : ''}/>`;
  }
  return out;
}
function f2lSVG(c) {
  const st = E.caseState('f2l', c);
  const view = c.slot === 'BR' ? 'y' : c.slot === 'BL' ? 'y2' : '';
  const v = view ? C.apply(st, view) : st;
  const target = C.SLOTS[c.slot].map(n => n.split('').sort().join(''));
  const freeP = c.free.flatMap(s => C.SLOTS[s]).map(n => n.split('').sort().join(''));
  const pieceOf = new Map(); C.PIECES.forEach(p => p.stickers.forEach(i => pieceOf.set(i, p)));

  let s = `<svg class="dia" viewBox="-2.75 -3.12 5.5 6.24" role="img" aria-label="${esc(c.name)}">`;
  // cube body
  const face = (n, t1, t2) => { const ctr = n.map(q => q * 1.5); const pts = [[1, 1], [1, -1], [-1, -1], [-1, 1]].map(([a, b]) => P(...ctr.map((q, i) => q + a * 1.52 * t1[i] + b * 1.52 * t2[i]))); return `<polygon points="${pts.map(p => p.join(',')).join(' ')}" class="body"/>`; };
  s += face([0, 1, 0], [1, 0, 0], [0, 0, 1]) + face([0, 0, 1], [1, 0, 0], [0, 1, 0]) + face([1, 0, 0], [0, 0, 1], [0, 1, 0]);
  ST.forEach((t, i) => {
    const n = t.n; let t1, t2;

  const thisWeek = M.list.filter(c => (cs(c.id).started || 0) >= ws);
  const pllDone = counts('pll').known === 21;
  h += `<div class="card stack"><h2>Up next</h2><p class="muted" style="margin:0;font-size:14px">${PACE[m]}. This week you started <b class="num">${m === 'f2l' ? new Set(thisWeek.map(c => c.group)).size + ' group' + (new Set(thisWeek.map(c => c.group)).size === 1 ? '' : 's') : thisWeek.length + ' case' + (thisWeek.length === 1 ? '' : 's')}</b>.</p>
  ${m === 'oll' && !pllDone ? `<div class="note err" style="background:var(--warn-soft);color:var(--warn)">The plan starts OLL after all 21 PLLs are Known (${counts('pll').known} of 21 so far). You can still start early.</div>` : ''}
  ${nx.length ? `<div class="chips">${nx.map(id => `<button class="chip" data-act="edit" data-id="${id}">${esc(BY[id].short || BY[id].name.replace('OLL ', ''))}${m === 'f2l' ? '' : ''}</button>`).join('')}</div>
  <div class="row"><button class="btn primary" data-act="learnNext">Start learning ${m === 'f2l' ? 'the ' + esc(BY[nx[0]].group) + ' group' : 'these ' + nx.length}</button></div>` : '<p style="margin:0">Every case in this set is started.</p>'}
  <details><summary class="muted" style="cursor:pointer;font-size:14px">Full order</summary><div class="chips" style="margin-top:8px">${ORDER[m].map(id => `<span class="chip" style="cursor:default">${esc(BY[id].short || BY[id].name.replace('OLL ', ''))} ${pill(cs(id).st)}</span>`).join('')}</div></details></div>`;

  h += `<div class="card stack"><h2>How cases move</h2><ol class="steps" style="font-size:14px">
    <li><b>Learning</b>: drill with the alg shown. After 20 tries a case moves to Practicing.</li>
    <li><b>Practicing</b>: drill in recall mode and push for speed.</li>
    <li><b>Known</b>: average under ${M.target}s across your last 12 recall tries with no “needed help”. It then shows up in the daily review.</li></ol>
    <p class="muted" style="margin:0;font-size:13px">Slow cases and ones you needed help with come up more often.</p></div>`;

  h += `<div class="card stack"><h2>Your data</h2><p class="muted" style="margin:0;font-size:14px">Times and settings are saved in this browser only. Copy a backup to move them to another device.</p>
    <div class="row"><button class="btn small" data-act="copyBackup">Copy backup</button><button class="btn small" data-act="showRestore">Restore from backup</button><button class="btn small danger" data-act="resetAsk">Reset everything</button></div>
    <div id="restoreBox" hidden class="stack"><textarea id="restoreText" rows="4" placeholder="Paste a backup here"></textarea><div class="row"><button class="btn small primary" data-act="restore">Restore</button></div></div>
    <div id="resetBox" hidden class="row"><span style="font-size:14px">Delete all times and statuses?</span><button class="btn small danger" data-act="resetDo">Yes, reset</button><button class="btn small" data-act="resetNo">Keep my data</button></div></div>`;
  return h + '</div>';
}

/* ---------- 15-day PLL plan ---------- */
const P15_DAYS = ['Jb', 'Ja', 'Aa', 'Ab', 'F', 'Ra', 'Rb', 'V', 'E', 'Na', 'Nb', 'Ga', 'Gb', 'Gc', 'Gd'];
const p15 = () => DB.plan15 || (DB.plan15 = { done: [], aaSwap: false });
function p15Days() { const sw = p15().aaSwap; return P15_DAYS.map(n => 'pll' + (sw && n === 'Aa' ? 'T' : n)); }
function p15Base() { return (p15().aaSwap ? ['Aa', 'Y', 'Ua', 'Ub', 'H', 'Z'] : ['T', 'Y', 'Ua', 'Ub', 'H', 'Z']).map(n => 'pll' + n); }
function p15Today() { const d = p15Days(); const i = d.findIndex(id => !p15().done.includes(id)); return i; }
function p15SoFar() { const d = p15Days(), i = p15Today(); return p15Base().concat(i < 0 ? d : d.slice(0, i + 1)); }
function pll15HTML() {
  const d = p15Days(), done = new Set(p15().done), i = p15Today(), n = d.filter(id => done.has(id)).length;
  let h = `<div class="stack"><div class="card stack"><div class="row" style="justify-content:space-between"><h2>Full PLL in 2 weeks</h2><span class="muted num">${n} of 15 days done</span></div>
  <div class="bar" role="img" aria-label="${n} of 15 days done"><i class="k" style="width:${(n / 15 * 100).toFixed(1)}%"></i></div>
  <p class="muted" style="margin:0;font-size:14px">One new PLL a day for 15 days. You already know ${p15Base().map(id => BY[id].short).join(', ')} from 2-look.</p></div>`;
  if (i >= 0) {
    const c = BY[d[i]];
    h += `<div class="card stack"><span class="label">Day ${i + 1} · today's case</span>
    <div class="caseinfo">${diagram(c)}<div><h2>${esc(c.name)}</h2><div class="alg" style="margin-top:4px">${esc(algOf(c))}</div><div class="muted" style="font-size:13px;margin-top:4px">${stats(c.id).n} tries · avg ${fmtT(stats(c.id).avg)}</div></div></div>
    <ol class="steps" style="font-size:14px"><li>Learn it slowly with the alg shown: <button class="btn small" data-act="p15Today">Drill today's case</button></li>
    <li>Then mix it with everything so far in recall mode: <button class="btn small" data-act="p15SoFar">Drill all ${p15SoFar().length} cases</button></li>
    <li>When it feels solid, mark the day done. If yesterday's case still feels shaky, repeat that day instead of moving on.</li></ol>
    <div class="row"><button class="btn primary" data-act="p15Done" data-id="${c.id}">Mark day ${i + 1} done</button></div></div>`;
  } else h += `<div class="card stack"><h2>All 15 days done</h2><p style="margin:0">You know full PLL. Keep reviewing in recall mode until every case is under 2.5s.</p><div class="row"><button class="btn primary" data-act="p15SoFar">Drill all 21 PLLs</button></div></div>`;
  h += `<div class="card stack"><h3>Schedule</h3><div class="stack" style="gap:6px">${d.map((id, k) => { const c = BY[id], on = done.has(id); return `<div class="row" style="justify-content:space-between;flex-wrap:nowrap;padding:6px 0;border-bottom:1px solid var(--line)"><span style="min-width:0"><b class="num" style="display:inline-block;width:56px">Day ${k + 1}</b>${esc(c.name)}${k === i ? ' <span class="pill st-practicing">Today</span>' : ''}</span><button class="btn small" data-act="p15Toggle" data-id="${id}" aria-pressed="${on}">${on ? 'Done' : 'Mark done'}</button></div>`; }).join('')}</div>
  <label class="switch"><input type="checkbox" data-act="p15Swap" ${p15().aaSwap ? 'checked' : ''}>My 2-look used Aa instead of T (T moves to Day 3)</label></div></div>`;
  return h;
}
function p15Drill(ids, recall) { DB.mode = 'pll'; DB.sel.pll = [...new Set(ids)]; DB.recall = recall; DB.tab = 'train'; cur = null; save(); render(); toast(ids.length === 1 ? `Drilling ${BY[ids[0]].name}.` : `Drilling ${ids.length} cases in recall mode.`); }

/* ---------- edit sheet ---------- */
let sheetId = null;
function openSheet(id, msg) {
  sheetId = id; const c = BY[id], st = cs(id).st, s = stats(id), on = DB.sel[c.mode].includes(id);
  const times = cs(id).times.slice(-20).reverse();
  $('#sheet').innerHTML = `<div class="sheet-bg" data-act="closeSheet"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(c.name)}">
    <div class="row" style="justify-content:space-between"><div><span class="label">${MODES[c.mode].label} · ${esc(c.group)}</span><h2>${esc(c.name)}</h2></div><button class="btn small" data-act="closeSheet">Close</button></div>
    <div style="width:150px;margin:0 auto">${diagram(c)}</div>
    <div><span class="label">Status</span><div class="row" style="margin-top:6px">${Object.keys(STATUS).map(k => `<button class="btn small" data-act="setStatus" data-v="${k}" aria-pressed="${st === k}">${STATUS[k]}</button>`).join('')}</div></div>
    <div class="stack" style="gap:6px"><label class="label" for="algInput">Your algorithm</label><textarea id="algInput" rows="2">${esc(algOf(c))}</textarea>
    <div class="row"><button class="btn small primary" data-act="saveAlg">Save alg</button>${cs(id).alg ? `<button class="btn small" data-act="resetAlg">Use standard alg</button>` : ''}<span class="muted alg" style="font-size:12px">Standard: ${esc(c.alg)}</span></div>
    ${msg ? `<div class="note ${msg.ok ? 'ok' : 'err'}">${esc(msg.text)}</div>` : ''}</div>
    <div class="statgrid"><div class="stat"><b>${s.n}</b><span>Attempts</span></div><div class="stat"><b>${fmtT(s.avg)}</b><span>Avg of 12</span></div><div class="stat"><b>${fmtT(s.best)}</b><span>Best</span></div><div class="stat"><b>${s.fails}</b><span>Needed help</span></div></div>
    <div class="history">${times.map(x => `<span class="${x.f ? 'f' : ''}">${fmtT(x.t)}${x.r ? '' : '·'}</span>`).join('') || '<span class="muted" style="background:none;padding:0">No times yet.</span>'}</div>
    ${times.length ? '<span class="muted" style="font-size:12px">A dot marks a time with the alg shown.</span>' : ''}
    <div class="row"><button class="btn small" data-act="sheetToggle">${on ? 'Remove from drill' : 'Add to drill'}</button><button class="btn small primary" data-act="drillNow">Drill this case next</button></div>
  </div></div>`;
}
function closeSheet() { sheetId = null; $('#sheet').innerHTML = ''; }

/* ---------- timer ---------- */
function setPad(cls) { const p = $('#pad'); if (!p) return; p.className = 'timerpad ' + cls; }
function startHold() {
  if (!cur || timer.state === 'running') return;
  timer.state = 'holding'; setPad('holding'); const t = $('#time'); if (t) t.textContent = '0.00';
  timer.hold = setTimeout(() => { if (timer.state === 'holding') { timer.state = 'ready'; setPad('ready'); } }, 300);
}
function release() {
  if (timer.state === 'holding') { clearTimeout(timer.hold); timer.state = 'idle'; setPad(''); return; }
  if (timer.state === 'ready') {
    timer.state = 'running'; timer.start = performance.now(); setPad('running');
    const tick = () => { if (timer.state !== 'running') return; const t = $('#time'); if (t) t.textContent = fmtT((performance.now() - timer.start) / 1000).replace(/(\.\d)\d$/, '$1'); timer.raf = requestAnimationFrame(tick); };
    tick();
  }
  if (timer.state === 'stopped') timer.state = 'done';
}
function stop() {
  const t = Math.round((performance.now() - timer.start) / 10) / 100;
  cancelAnimationFrame(timer.raf); timer.state = 'stopped';
  const c = cur.c, rec = { t, r: DB.recall ? 1 : 0, f: 0, d: Date.now() };
  const cc = cs(c.id); cc.times.push(rec); if (cc.times.length > 150) cc.times.splice(0, cc.times.length - 150);
  last = { id: c.id, t, recall: DB.recall, reveal: false, rec, f: 0 };
  sessionTimes.push({ id: c.id, t, f: 0, rec });
  promote(c);
  save(); newScramble(); render();
  timer.state = 'stopped'; setPad('');
}
function promote(c) {
  const cc = cs(c.id), s = stats(c.id);
  if ((cc.st === 'learning') && s.n >= 20) { cc.st = 'practicing'; toast(`${c.short || c.name} moved to Practicing after 20 tries.`); }
  if (cc.st !== 'known' && s.recallAvg != null && s.recallAvg < MODES[c.mode].target) { cc.st = 'known'; toast(`${c.short || c.name} is Known: ${fmtT(s.recallAvg)} average over 12 recall tries.`); }
}

/* ---------- events ---------- */
let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }
function setSel(m, ids) { DB.sel[m] = [...new Set(ids)]; save(); render(); }
function act(a, el, ev) {
  const m = DB.mode, M = MODES[m], v = el.dataset.v, id = el.dataset.id;
  const sel = new Set(DB.sel[m]);
  switch (a) {
    case 'tab': DB.tab = v; save(); render(); break;
    case 'p15Today': p15Drill([p15Days()[p15Today()]], false); break;
    case 'p15SoFar': p15Drill(p15SoFar(), true); break;
    case 'p15Done': case 'p15Toggle': { const p = p15(), k = p.done.indexOf(id); if (k >= 0) p.done.splice(k, 1); else { p.done.push(id); const cc = cs(id); if (cc.st === 'new') { cc.st = 'learning'; cc.started = Date.now(); } } save(); render(); if (a === 'p15Done') toast(p15Today() < 0 ? 'All 15 days done!' : `Day done. Tomorrow: ${BY[p15Days()[p15Today()]].name}.`); break; }
    case 'toggle': sel.has(id) ? sel.delete(id) : sel.add(id); setSel(m, [...sel]); break;
    case 'selAll': setSel(m, M.list.map(c => c.id)); break;
    case 'selNone': setSel(m, []); break;
    case 'selGroup': { const ids = M.list.filter(c => c.group === v).map(c => c.id); const all = ids.every(i => sel.has(i)); ids.forEach(i => all ? sel.delete(i) : sel.add(i)); setSel(m, [...sel]); break; }
    case 'selSlot': setSel(m, M.list.filter(c => v === 'FR' ? c.slot === 'FR' : c.slot !== 'FR').map(c => c.id)); break;
    case 'selStatus': setSel(m, M.list.filter(c => cs(c.id).st === v).map(c => c.id)); break;
    case 'edit': ev.stopPropagation(); openSheet(id); break;
    case 'closeSheet': if (ev.target === el) { closeSheet(); render(); } break;
    case 'setStatus': { const cc = cs(sheetId); cc.st = v; if (v === 'learning' && !cc.started) cc.started = Date.now(); if (v !== 'new' && !cc.started) cc.started = Date.now(); save(); openSheet(sheetId); render(); break; }
    case 'saveAlg': {
      const c = BY[sheetId], txt = $('#algInput').value.trim();
      let msg;
      try {
        C.parse(txt);
        if (!txt) throw new Error('Type an algorithm first.');
        const ok = E.solves(c.mode, c, E.caseState(c.mode, c), txt);
        if (txt === c.alg) delete cs(c.id).alg; else cs(c.id).alg = txt;
        msg = ok ? { ok: true, text: 'Saved. The simulator confirms it solves this case.' } : { ok: false, text: 'Saved, but the simulator says this does not solve the case (even with a U turn before or after). Check it on a cube.' };
        save();
      } catch (e) { msg = { ok: false, text: e.message + '. Use moves like R U R\' U\' (wide: r or Rw, slices: M E S, rotations: x y z).' }; }
      openSheet(sheetId, msg); render(); break;
    }
    case 'resetAlg': delete cs(sheetId).alg; save(); openSheet(sheetId, { ok: true, text: 'Back to the standard alg.' }); render(); break;
    case 'sheetToggle': { const c = BY[sheetId], s2 = new Set(DB.sel[c.mode]); s2.has(c.id) ? s2.delete(c.id) : s2.add(c.id); DB.sel[c.mode] = [...s2]; save(); openSheet(sheetId); render(); break; }
    case 'drillNow': { const c = BY[sheetId]; DB.mode = c.mode; forceCase = c.id; DB.tab = 'train'; newScramble(); save(); closeSheet(); render(); break; }
    case 'recall': DB.recall = el.checked; save(); render(); break;
    case 'toggleNet': DB.showNet = !DB.showNet; save(); render(); break;
    case 'skip': newScramble(); timer.state = 'idle'; render(); break;
    case 'reveal': if (last) last.reveal = true; render(); break;
    case 'fail': if (last) { last.f = last.rec.f = last.f ? 0 : 1; const s = sessionTimes.find(x => x.rec === last.rec); if (s) s.f = last.f; save(); render(); } break;
    case 'delLast': if (last) { const cc = cs(last.id); const i = cc.times.indexOf(last.rec); if (i >= 0) cc.times.splice(i, 1); sessionTimes = sessionTimes.filter(x => x.rec !== last.rec); last = null; save(); toast('Time deleted.'); render(); } break;
    case 'startBlock': DB.session = { mode: m, block: v, end: Date.now() + BLOCKS[v].mins * 60000 }; DB.recall = v !== 'learn'; DB.tab = 'train'; save(); newScramble(); render(); break;
    case 'endSession': DB.session = null; save(); newScramble(); render(); break;
    case 'learnNext': { const nx = upNext(m); nx.forEach(i => { const cc = cs(i); cc.st = 'learning'; cc.started = Date.now(); sel.add(i); }); DB.sel[m] = [...sel]; save(); toast(`Started ${nx.length} case${nx.length === 1 ? '' : 's'}. They're in your Learn block and selection.`); render(); break; }
    case 'copyBackup': { const txt = JSON.stringify(DB); navigator.clipboard.writeText(txt).then(() => toast('Backup copied. Paste it somewhere safe.'), () => { $('#restoreBox').hidden = false; $('#restoreText').value = txt; $('#restoreText').select(); toast('Copy the selected text to keep a backup.'); }); break; }
    case 'showRestore': $('#restoreBox').hidden = false; break;
    case 'restore': try { const d = JSON.parse($('#restoreText').value); if (!d || !d.cases) throw 0; DB = Object.assign(defaults(), d); save(); cur = null; toast('Backup restored.'); render(); } catch (e) { toast('That does not look like a Zach’s Case Trainer backup.'); } break;
    case 'resetAsk': $('#resetBox').hidden = false; break;
    case 'resetNo': $('#resetBox').hidden = true; break;
    case 'resetDo': DB = defaults(); save(); cur = null; last = null; sessionTimes = []; toast('Everything was reset.'); render(); break;
  }
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.dataset.act === 'recall' || el.dataset.act === 'p15Swap') return; // handled by change
  if (el.closest('#pad')) return;
  act(el.dataset.act, el, e);
});
document.addEventListener('change', e => { if (e.target.dataset.act === 'recall') act('recall', e.target, e); if (e.target.dataset.act === 'p15Swap') { p15().aaSwap = e.target.checked; save(); render(); } });
document.getElementById('modeSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; DB.mode = b.dataset.mode; cur = null; timer.state = 'idle'; save(); render(); });
document.getElementById('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; DB.tab = b.dataset.tab; save(); render(); });
const typing = () => { const a = document.activeElement; return a && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT' && a.type === 'text'); };
document.addEventListener('keydown', e => {
  if (sheetId) { if (e.key === 'Escape') { closeSheet(); render(); } return; }
  if (typing() || DB.tab !== 'train') return;
  if (timer.state === 'running') { e.preventDefault(); stop(); return; }
  if (e.code === 'Space') { e.preventDefault(); if (!e.repeat && ['idle', 'done', 'stopped'].includes(timer.state)) startHold(); }
  else if (e.key === 'Enter' && document.activeElement && document.activeElement.dataset && document.activeElement.dataset.act === 'toggle') act('toggle', document.activeElement, e);
});
document.addEventListener('keyup', e => { if (e.code === 'Space' && DB.tab === 'train' && !sheetId && !typing()) { e.preventDefault(); release(); } });
document.addEventListener('pointerdown', e => {
  if (DB.tab !== 'train' || sheetId) return;
  if (timer.state === 'running') { e.preventDefault(); stop(); return; }
  if (e.target.closest('#pad') && (timer.state === 'idle' || timer.state === 'done')) { e.preventDefault(); startHold(); }
});
document.addEventListener('pointerup', e => { if (DB.tab === 'train' && !sheetId) release(); });
document.addEventListener('pointercancel', () => { if (timer.state === 'holding' || timer.state === 'ready') { clearTimeout(timer.hold); timer.state = 'idle'; setPad(''); } });
setInterval(() => {
  const s = DB.session; if (!s) return;
  if (Date.now() > s.end) { activeSession(); if (timer.state !== 'running') render(); return; }
  const el = $('#sesLeft'); if (el) el.textContent = fmtLeft(s.end - Date.now());
}, 1000);
// arrow marker defs shared by all diagrams
document.body.insertAdjacentHTML('beforeend', '<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arwh"/></marker></defs></svg>');
render();
})();

</script>
</body>
</html>
